name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/audit_public.py --all-history
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Synthetic C regressions
        run: |
          mkdir -p work
          for name in nvn55 nvn55_objects descriptors program_bind fact_set; do
            cc -std=gnu11 -Wall -Wextra -Wno-unused-function -Ithird_party/blade2-mobile/dm/gfx/nvn/include "tests/test_${name}.c" -o "work/test-${name}"
            "work/test-${name}"
          done
  darwin-service-abi:
    # HLE registration uses Mach-O sections, so this test needs Apple's assembler.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native service buffer canaries
        run: |
          mkdir -p work
          clang -Wall -Wextra -Wno-unused-function tests/test_hle.c -o work/test-hle
          ./work/test-hle
